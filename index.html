<style>
/* Layout: dicionário de consulta — cabeçalho fixo com busca, índice lateral de linguagens, verbetes em coluna central */
:root {
  --bg: #F3F5F8;
  --surface: #FFFFFF;
  --sunk: #E9EDF3;
  --fg: #131822;
  --muted: #586274;
  --line: #D8DEE7;
  --accent: #1E57CF;
  --accent-ink: #FFFFFF;
  --accent-soft: #E2EAFA;
  --code-bg: #F7F9FC;
  --c-kw: #B0245A;
  --c-str: #1B7642;
  --c-com: #7A8496;
  --c-num: #A85400;
  --c-fn: #1E57CF;
  --c-type: #7339BD;
  --c-attr: #0A6A7E;
  --ok: #1B7642;
  --warn: #A85400;

  --f-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;

  --logo-inv: none;
  --veu: rgba(19, 24, 34, 0.35);
  --r: 10px;
  --header-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1117; --surface: #141A23; --sunk: #1A2230; --fg: #E5E9F0; --muted: #95A0B3; --line: #263041;
    --accent: #79A2FF; --accent-ink: #0A1022; --accent-soft: #1A2742; --code-bg: #0F151E;
    --c-kw: #FF7FAA; --c-str: #82D49E; --c-com: #6C788C; --c-num: #FFB46E; --c-fn: #86B2FF; --c-type: #CBA5FF; --c-attr: #6FD0E3;
    --ok: #82D49E; --warn: #FFB46E;
    --logo-inv: invert(1) hue-rotate(180deg);
    --veu: rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1117; --surface: #141A23; --sunk: #1A2230; --fg: #E5E9F0; --muted: #95A0B3; --line: #263041;
  --accent: #79A2FF; --accent-ink: #0A1022; --accent-soft: #1A2742; --code-bg: #0F151E;
  --c-kw: #FF7FAA; --c-str: #82D49E; --c-com: #6C788C; --c-num: #FFB46E; --c-fn: #86B2FF; --c-type: #CBA5FF; --c-attr: #6FD0E3;
  --ok: #82D49E; --warn: #FFB46E;
  --logo-inv: invert(1) hue-rotate(180deg);
  --veu: rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.6;
}
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface);
}

/* ---------- Cabeçalho ---------- */
.topo {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.topo-in {
  max-width: 1280px; margin: 0 auto;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 20px;
}
.marca {
  display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg);
  font-family: var(--f-display); font-weight: 700; font-size: 18px; letter-spacing: -0.01em; white-space: nowrap;
}
.marca-icone { display: block; width: 36px; height: 36px; flex: none; }
.marca-icone svg { display: block; width: 100%; height: 100%; }
.busca { flex: 1; max-width: 460px; position: relative; }
.busca input {
  width: 100%; height: 40px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--bg); color: var(--fg); font: inherit; padding: 0 12px 0 38px;
}
.busca input::placeholder { color: var(--muted); }
.busca svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.links { display: flex; gap: 4px; margin-left: auto; }
.links a {
  text-decoration: none; color: var(--muted); font-weight: 500; padding: 8px 12px; border-radius: 8px; white-space: nowrap;
}
.links a:hover { color: var(--fg); background: var(--sunk); }
.links a.ativo { color: var(--fg); background: var(--sunk); }

/* ---------- Corpo ---------- */
.corpo {
  max-width: 1280px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.lateral {
  position: fixed; top: 0; bottom: 0; left: 0; z-index: 40;
  width: min(300px, 85vw); overflow-y: auto;
  background: var(--surface); border-right: 1px solid var(--line);
  padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 32px);
  padding-left: calc(env(safe-area-inset-left, 0px) + 20px);
  padding-right: 20px;
  transform: translateX(-100%); visibility: hidden;
  transition: transform .22s ease, visibility .22s;
}
.lateral.aberto { transform: none; visibility: visible; box-shadow: 0 10px 40px var(--veu); }
.lateral-cab { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.lateral-cab strong { font-family: var(--f-display); font-size: 17px; }
.veu { position: fixed; inset: 0; z-index: 35; background: var(--veu); }
.icone-btn {
  display: grid; place-items: center; width: 40px; height: 40px; flex: none; cursor: pointer;
  border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
}
.icone-btn:hover { background: var(--sunk); }
.grupo + .grupo { margin-top: 20px; }
.grupo h4 {
  margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600;
}
.grupo a {
  display: flex; align-items: center; gap: 10px; padding: 5px 10px; margin-left: -10px; border-radius: 6px;
  text-decoration: none; color: var(--fg); font-size: 14px;
}
.grupo a:hover { background: var(--sunk); }
.grupo a.ativo { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.logo { width: 18px; height: 18px; flex: none; object-fit: contain; display: block; }
.logo.escuro { filter: var(--logo-inv); }
.logo-sql { color: #E38C00; }
.dot {
  width: 10px; height: 10px; border-radius: 50%; flex: none;
  box-shadow: 0 0 0 1px var(--line);
}
main { min-width: 0; max-width: 1040px; margin: 0 auto; padding-block: 28px 80px; }

/* ---------- Tipografia ---------- */
h1, h2, h3 { font-family: var(--f-display); letter-spacing: -0.015em; text-wrap: balance; line-height: 1.2; }
h1 { font-size: clamp(30px, 4vw, 42px); margin: 0; }
h2 { font-size: 22px; margin: 0 0 4px; }
h3 { font-size: 17px; margin: 0; }
.rotulo { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.leve { color: var(--muted); }
p { margin: 0; }
.prosa { max-width: 68ch; }

/* ---------- Início ---------- */
.hero { padding-block: 12px 32px; border-bottom: 1px solid var(--line); display: grid; gap: 12px; }
.hero h1 { font-size: clamp(32px, 5vw, 52px); }
.hero p { font-size: 17px; color: var(--muted); max-width: 60ch; }
.hero .autoria { font-size: 14px; margin-top: -4px; }
.hero .autoria strong { color: var(--fg); font-weight: 600; }
.verbete-modelo {
  margin-top: 8px; font-family: var(--f-mono); font-size: 13px; color: var(--muted);
  padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); max-width: 620px;
}
.verbete-modelo b { color: var(--fg); font-weight: 600; }
.verbete-modelo i { color: var(--c-kw); font-style: normal; }
.secao { margin-top: 40px; display: grid; gap: 16px; }
.secao-cab { display: grid; gap: 4px; }

.tabela-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 520px; }
th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; background: var(--sunk); }
td:first-child { font-weight: 500; width: 40%; }
.pilulas { display: flex; flex-wrap: wrap; gap: 6px; }
.pilula {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg); text-decoration: none; font-size: 13px; font-weight: 500;
}
a.pilula:hover { border-color: var(--accent); color: var(--accent); }
.pilula .dot { width: 8px; height: 8px; }
.pilula small { color: var(--muted); font-weight: 400; }

.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.cartao {
  display: grid; gap: 8px; align-content: start; padding: 16px; border-radius: var(--r);
  background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--fg);
  transition: border-color .15s, transform .15s;
}
.cartao:hover { border-color: var(--accent); transform: translateY(-1px); }
.cartao-topo { display: flex; align-items: center; gap: 8px; }
.cartao-topo h3 { font-size: 16px; }
.cartao-topo .logo { width: 24px; height: 24px; }
.cartao-topo .ext { margin-left: auto; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.cartao p { font-size: 13.5px; color: var(--muted); line-height: 1.5; }
.dific { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.barras { display: inline-flex; gap: 3px; }
.barras i { width: 14px; height: 5px; border-radius: 2px; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--line); }
.barras i.on { background: var(--fg); box-shadow: none; }

.aviso {
  display: grid; gap: 6px; padding: 18px 20px; border-radius: var(--r);
  background: var(--accent-soft); border: 1px solid var(--line);
}
.aviso h3 { color: var(--accent); }

/* ---------- Página da linguagem ---------- */
.lp-cab { display: grid; gap: 14px; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
.lp-nome { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; }
.lp-nome .dot { width: 14px; height: 14px; align-self: center; }
.lp-nome .logo { width: 40px; height: 40px; align-self: center; }
.pron { font-family: var(--f-mono); font-size: 15px; color: var(--muted); }
.classe-gram { font-size: 14px; color: var(--muted); font-style: italic; }
.resumo { font-size: 17px; max-width: 64ch; }
.ficha {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px;
  background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; margin: 0;
}
.ficha div { background: var(--surface); padding: 12px 14px; display: grid; gap: 2px; }
.ficha dt { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.ficha dd { margin: 0; font-weight: 500; }
.ficha dd code { font-family: var(--f-mono); font-size: 14px; }
.colunas { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
.colunas ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; }
.colunas li::marker { color: var(--muted); }
.mais li::marker { content: "+  "; color: var(--ok); font-weight: 700; }
.menos li::marker { content: "!  "; color: var(--warn); font-weight: 700; }

.indice { display: flex; flex-wrap: wrap; gap: 6px; }
.indice a {
  font-size: 13px; text-decoration: none; color: var(--muted); padding: 4px 10px; border-radius: 6px; background: var(--sunk);
}
.indice a:hover { color: var(--fg); }

.verbetes { display: grid; gap: 14px; }
.verbete {
  display: grid; gap: 10px; padding: 18px 20px; border-radius: var(--r);
  background: var(--surface); border: 1px solid var(--line);
  scroll-margin-top: calc(var(--header-h) + 20px);
}
.verbete:target { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.vb-cab { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; }
.vb-cab .termo { font-family: var(--f-mono); font-size: 13px; color: var(--c-kw); }
.vb-desc { color: var(--muted); max-width: 72ch; }
.nota {
  font-size: 13.5px; padding: 8px 12px; border-radius: 8px; background: var(--sunk); color: var(--fg); max-width: 72ch;
}
.nota b { font-weight: 600; }

/* ---------- Código ---------- */
.codigo { border: 1px solid var(--line); border-radius: 8px; background: var(--code-bg); overflow: hidden; min-width: 0; }
.codigo-barra {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 4px 6px 4px 12px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); font-family: var(--f-mono);
}
.copiar {
  font: 500 12px var(--f-body); color: var(--muted); background: transparent; border: 1px solid transparent;
  padding: 3px 10px; border-radius: 6px; cursor: pointer;
}
.copiar:hover { color: var(--fg); border-color: var(--line); background: var(--surface); }
.copiar.feito { color: var(--ok); }
pre { margin: 0; padding: 14px 16px; overflow-x: auto; }
code, pre { font-family: var(--f-mono); font-size: 13.5px; line-height: 1.6; }
pre code { color: var(--fg); white-space: pre; }
:not(pre) > code {
  font-size: 0.9em; padding: 1px 5px; border-radius: 4px; background: var(--sunk);
}
.hljs-keyword, .hljs-literal, .hljs-selector-tag, .hljs-tag, .hljs-name { color: var(--c-kw); }
.hljs-string, .hljs-regexp, .hljs-char.escape_ { color: var(--c-str); }
.hljs-comment, .hljs-quote { color: var(--c-com); font-style: italic; }
.hljs-number, .hljs-symbol, .hljs-meta { color: var(--c-num); }
.hljs-title, .hljs-section { color: var(--c-fn); }
.hljs-type, .hljs-built_in, .hljs-title.class_, .hljs-class .hljs-title { color: var(--c-type); }
.hljs-attr, .hljs-attribute, .hljs-property, .hljs-selector-class, .hljs-selector-id, .hljs-selector-pseudo, .hljs-variable, .hljs-template-variable { color: var(--c-attr); }
.hljs-meta .hljs-string { color: var(--c-str); }
.hljs-subst, .hljs-params { color: inherit; }

/* ---------- Comparar ---------- */
.conceitos { display: flex; flex-wrap: wrap; gap: 6px; }
.conceitos a {
  text-decoration: none; padding: 7px 14px; border-radius: 8px; font-weight: 500; font-size: 14px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
}
.conceitos a:hover { border-color: var(--accent); }
.conceitos a.ativo { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.comp { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 12px; }
.filtro {
  display: grid; gap: 12px; padding: 14px 16px; border-radius: var(--r);
  background: var(--surface); border: 1px solid var(--line);
}
.filtro-cab { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 12px; }
.filtro-cab .leve { font-size: 13px; font-variant-numeric: tabular-nums; }
.filtro-cab .mini:first-of-type { margin-left: auto; }
.mini {
  font: 500 13px var(--f-body); color: var(--accent); background: none; border: 0;
  padding: 4px 8px; border-radius: 6px; cursor: pointer;
}
.mini:hover { background: var(--sunk); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px 5px 8px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--bg); color: var(--muted);
  font: 500 13px var(--f-body); cursor: pointer; transition: background .12s, border-color .12s;
}
.chip:hover { border-color: var(--accent); }
.chip .logo { width: 16px; height: 16px; opacity: .45; filter: grayscale(1); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); }
.chip[aria-pressed="true"] .logo { opacity: 1; filter: none; }
.chip[aria-pressed="true"] .logo.escuro { filter: var(--logo-inv); }
.comp-item { display: grid; gap: 8px; align-content: start; min-width: 0; }
.comp-item > a { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--fg); font-weight: 600; font-family: var(--f-display); }
.comp-item > a:hover { color: var(--accent); }

/* ---------- Glossário ---------- */
.letra { font-family: var(--f-display); font-size: 28px; font-weight: 700; color: var(--accent); margin-top: 18px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.gloss { margin: 0; display: grid; }
.gloss div { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 4px 24px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.gloss dt { font-weight: 600; font-family: var(--f-display); }
.gloss dt small { display: block; font-family: var(--f-mono); font-weight: 400; font-size: 12px; color: var(--muted); }
.gloss dd { margin: 0; color: var(--fg); max-width: 70ch; }

/* ---------- Busca ---------- */
.resultados { display: grid; gap: 8px; }
.res {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; align-items: baseline;
  padding: 12px 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line);
  text-decoration: none; color: var(--fg);
}
.res:hover { border-color: var(--accent); }
.res .dot { align-self: center; }
.res strong { font-weight: 600; }
.res .sub { grid-column: 2; font-size: 13.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
mark { background: var(--accent-soft); color: var(--accent); border-radius: 3px; padding: 0 2px; }

.navega { display: flex; justify-content: space-between; gap: 12px; margin-top: 40px; flex-wrap: wrap; }
.navega a {
  display: grid; gap: 2px; text-decoration: none; padding: 12px 16px; border: 1px solid var(--line); border-radius: var(--r);
  background: var(--surface); color: var(--fg); font-weight: 600; min-width: 160px;
}
.navega a:hover { border-color: var(--accent); }
.navega a:last-child { text-align: right; margin-left: auto; }

footer strong { color: var(--fg); font-weight: 600; }
footer { margin-top: 60px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }

/* ---------- Responsivo ---------- */
@media (max-width: 860px) {
  .topo-in { flex-wrap: wrap; gap: 10px 12px; }
  .busca { order: 3; flex-basis: 100%; max-width: none; }
  .verbete { scroll-margin-top: 130px; padding: 16px; }
  .gloss div { grid-template-columns: minmax(0, 1fr); }
  .links { gap: 0; }
  .links a { padding: 6px 8px; font-size: 14px; }
}
@media (max-width: 480px) {
  .marca-texto { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>

const ORDEM = Object.keys(L);
const $ = (s) => document.querySelector(s);
const main = $("#conteudo");
const CODES = [];

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const norm = (s) => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

function realce(code, hl) {
  try {
    if (window.hljs && hljs.getLanguage(hl)) return hljs.highlight(code, { language: hl, ignoreIllegals: true }).value;
  } catch (e) {}
  return esc(code);
}

function bloco(code, hl, rotulo) {
  const i = CODES.push(code) - 1;
  return `<div class="codigo"><div class="codigo-barra"><span>${esc(rotulo)}</span><button class="copiar" type="button" data-i="${i}">Copiar</button></div><pre><code>${realce(code, hl)}</code></pre></div>`;
}

function barras(n) {
  let s = "";
  for (let i = 1; i <= 5; i++) s += `<i class="${i <= n ? "on" : ""}"></i>`;
  return `<span class="dific"><span class="barras" aria-hidden="true">${s}</span>${DIF[n]}</span>`;
}

const dot = (id) => `<span class="dot" style="background:${L[id].cor}"></span>`;
const pil = (id) => `<a class="pilula" href="#${id}">${dot(id)}${esc(L[id].nome)}</a>`;

function conc(id, k) {
  const v = L[id].conceitos && L[id].conceitos[k];
  if (v == null) return null;
  return typeof v === "string" ? { c: v } : v;
}

const ORDEM_MENU = CATS.flatMap((cat) => ORDEM.filter((id) => L[id].cat === cat));

/* Começa sempre com tudo desmarcado; a escolha vale enquanto a página estiver aberta. */
function carregarSel() { return new Set(); }
function salvarSel() {}

function renderComp() {
  const conceito = compAtual;
  const escolhidas = ORDEM_MENU.filter((id) => SEL.has(id));
  $("#selCont").textContent = `${escolhidas.length} de ${ORDEM.length} escolhidas`;
  document.querySelectorAll(".chip[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(SEL.has(b.dataset.lang))));
  if (!escolhidas.length) {
    $("#comp").innerHTML = `<p class="nota">Escolha acima as linguagens que você quer comparar, ou clique em “Marcar todas”.</p>`;
    return;
  }
  $("#comp").innerHTML = escolhidas.map((id) => {
    const it = conc(id, conceito.k);
    let corpo = "";
    if (!it) corpo = `<p class="nota">${esc(L[id].semConceito || `Não existe em ${L[id].nome}.`)}</p>`;
    else {
      if (it.nota) corpo += `<p class="nota">${it.nota}</p>`;
      if (it.c) corpo += bloco(it.c, L[id].hl, L[id].nome);
    }
    return `<div class="comp-item"><a href="#${L[id].marcacao ? id : `${id}-${conceito.k}`}">${dot(id)}${esc(L[id].nome)}</a>${corpo}</div>`;
  }).join("");
}

function pagComparar(k) {

/* ---------- Glossário ---------- */
function pagGlossario() {
  const ordenado = GLOSSARIO.slice().sort((a, b) => a[0].localeCompare(b[0], "pt"));
  let html = "", letra = "";
  ordenado.forEach(([termo, aka, def]) => {
    const l1 = norm(termo)[0].toUpperCase();
    if (l1 !== letra) {
      if (letra) html += `</dl>`;
      letra = l1;
      html += `<div class="letra">${l1}</div><dl class="gloss">`;
    }
    html += `<div id="g-${norm(termo).replace(/[^a-z0-9]+/g, "-")}"><dt>${esc(termo)}${aka ? `<small>${esc(aka)}</small>` : ""}</dt><dd>${esc(def)}</dd></div>`;
  });
  html += `</dl>`;
  main.innerHTML = `
    <section class="hero">
      <span class="rotulo">Glossário</span>
      <h1>Palavras que todo iniciante ouve</h1>
      <p>Termos da programação explicados de forma simples, em ordem alfabética.</p>
    </section>
    <section class="secao" style="gap:0">${html}</section>
    ${rodape()}`;
  marcarAtivo(null, "glossario");
}

/* ---------- Busca ---------- */
const INDICE = [];
function montarIndice() {
  ORDEM.forEach((id) => {
    const l = L[id];
    INDICE.push({ id, alvo: id, titulo: l.nome, sub: l.resumo, texto: [l.nome, l.resumo, l.usos.join(" "), l.cat].join(" ") });
    if (l.marcacao) {
      l.comandos.forEach((it, i) => INDICE.push({ id, alvo: `${id}-c${i}`, titulo: it.t, sub: it.d || it.c.split("\n")[0], texto: [it.t, it.d, it.c].join(" ") }));
    } else {
      CONCEITOS.forEach((k) => {
        const it = conc(id, k.k);
        if (it) INDICE.push({ id, alvo: `${id}-${k.k}`, titulo: k.t, sub: (it.c || "").split("\n").find((x) => x.trim()) || "", texto: [k.t, k.d, it.c || "", it.nota || ""].join(" ") });
      });
      (l.extras || []).forEach((it, i) => INDICE.push({ id, alvo: `${id}-x${i}`, titulo: it.t, sub: it.d || it.c.split("\n")[0], texto: [it.t, it.d, it.c].join(" ") }));
    }
  });
  GLOSSARIO.forEach(([t, aka, d]) => INDICE.push({ id: null, alvo: "glossario", titulo: t, sub: d, texto: [t, aka, d].join(" ") }));
  INDICE.forEach((e) => (e.n = norm(e.texto)));
}

function destacar(texto, termos) {
  let s = esc(texto);
  termos.forEach((t) => {
    if (!t) return;
    const re = new RegExp("(" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
    s = s.replace(re, "<mark>$1</mark>");
  });
  return s;
}

function pagBusca(q) {
  const termos = norm(q).split(/\s+/).filter(Boolean);
  const res = INDICE.filter((e) => termos.every((t) => e.n.includes(t)))
    .map((e) => ({ e, peso: termos.reduce((p, t) => p + (norm(e.titulo).includes(t) ? 2 : 0) + (e.id && norm(L[e.id].nome).includes(t) ? 1 : 0), 0) }))
    .sort((a, b) => b.peso - a.peso)
    .slice(0, 80);

  const lista = res.map(({ e }) => `
    <a class="res" href="#${e.alvo}">
      ${e.id ? dot(e.id) : `<span class="dot" style="background:var(--muted)"></span>`}
      <strong>${destacar(e.titulo, q.split(/\s+/))} <small class="leve">· ${e.id ? esc(L[e.id].nome) : "Glossário"}</small></strong>
      <span class="sub">${esc(e.sub)}</span>
    </a>`).join("");

  main.innerHTML = `
    <section class="secao" style="margin-top:0">
      <div class="secao-cab">
        <span class="rotulo">Busca</span>
        <h2>${res.length ? `${res.length} resultado${res.length > 1 ? "s" : ""} para “${esc(q)}”` : `Nada encontrado para “${esc(q)}”`}</h2>
        ${res.length ? "" : `<p class="leve">Tente outra palavra, como <code>print</code>, <code>lista</code>, <code>função</code> ou <code>SELECT</code>.</p>`}
      </div>
      <div class="resultados">${lista}</div>
    </section>
    ${rodape()}`;
  marcarAtivo(null, null);
}

/* ---------- Rodapé ---------- */
const rodape = () => `<footer>Dicionário do Programador · criado por <strong>Júlio Monteiro Assoni</strong> · material de estudo para iniciantes. Os exemplos são simplificados para facilitar o aprendizado.</footer>`;

/* ---------- Rotas ---------- */
let atual = null;
function rota() {
  const h = decodeURIComponent(location.hash.slice(1));
  const busca = $("#busca");
  if (busca.value) busca.value = "";
  CODES.length = 0;
  const base = h.split("-")[0];

  if (!h) { atual = null; pagInicio(); window.scrollTo(0, 0); return; }
  if (h === "comparar" || h.startsWith("comparar-")) { atual = null; pagComparar(h.split("-")[1]); window.scrollTo(0, 0); return; }
  if (h === "glossario") { atual = null; pagGlossario(); window.scrollTo(0, 0); return; }
  if (L[base]) {
    if (atual !== base || !main.querySelector(".lp-cab")) { pagLinguagem(base); atual = base; }
    const alvo = h !== base ? document.getElementById(h) : null;
    if (alvo) alvo.scrollIntoView({ block: "start" }); else window.scrollTo(0, 0);
    return;
  }
  atual = null; pagInicio();
}

/* ---------- Eventos ---------- */
let tempo;
$("#busca").addEventListener("input", (e) => {
  clearTimeout(tempo);
  const q = e.target.value.trim();
  tempo = setTimeout(() => {
    CODES.length = 0;
    if (q) { atual = null; pagBusca(q); window.scrollTo(0, 0); }
    else { atual = null; rota(); }
  }, 120);
});

document.addEventListener("click", (e) => {
  const b = e.target.closest(".copiar");
  if (!b) return;
  const texto = CODES[+b.dataset.i];
  const ok = () => { b.textContent = "Copiado!"; b.classList.add("feito"); setTimeout(() => { b.textContent = "Copiar"; b.classList.remove("feito"); }, 1500); };
  const selecionar = () => {
    const code = b.closest(".codigo").querySelector("code");
    const r = document.createRange(); r.selectNodeContents(code);
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    b.textContent = "Use Ctrl+C";
  };
  try { navigator.clipboard.writeText(texto).then(ok, selecionar); } catch (err) { selecionar(); }
});

window.addEventListener("hashchange", rota);

/* ---------- Escolher linguagens no Comparar ---------- */
document.addEventListener("click", (e) => {
  const chip = e.target.closest(".chip[data-lang]");
  const acao = e.target.closest("[data-sel]");
  if (!chip && !acao) return;
  if (chip) {
    const id = chip.dataset.lang;
    if (SEL.has(id)) SEL.delete(id); else SEL.add(id);
  } else if (acao.dataset.sel === "todas") {
    SEL = new Set(ORDEM);
  } else {
    SEL = new Set();
  }
  salvarSel();
  renderComp();
});

/* ---------- Menu (três risquinhos) ---------- */
const lateral = $("#lateral"), veu = $("#veu"), menuBtn = $("#menuBtn");
function abrirMenu(abrir) {
  lateral.classList.toggle("aberto", abrir);
  veu.hidden = !abrir;
  menuBtn.setAttribute("aria-expanded", String(abrir));
  if (abrir) {
    const a = lateral.querySelector("a.ativo") || lateral.querySelector("a");
    if (a) a.focus({ preventScroll: true });
  } else if (lateral.contains(document.activeElement)) {
    menuBtn.focus();
  }
}
menuBtn.addEventListener("click", () => abrirMenu(!lateral.classList.contains("aberto")));
veu.addEventListener("click", () => abrirMenu(false));
lateral.addEventListener("click", (e) => { if (e.target.closest("a, .fechar")) abrirMenu(false); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && lateral.classList.contains("aberto")) abrirMenu(false); });

montarLateral();
montarIndice();
rota();
</script>
</body>
